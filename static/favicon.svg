<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" rx="8" fill="#cfe8d2"/>
  <!-- Windows 2000-era paired CRT computers: upper-left and lower-right -->
  <rect x="5" y="6" width="25" height="19" fill="#d7e3e8" stroke="#64748b" stroke-width="2"/>
  <rect x="8" y="9" width="19" height="12" fill="#1f4e79"/>
  <rect x="14" y="25" width="7" height="4" fill="#94a3b8"/>
  <rect x="10" y="29" width="15" height="3" fill="#d7e3e8" stroke="#64748b"/>
  <rect x="34" y="32" width="25" height="19" fill="#d7e3e8" stroke="#64748c" stroke-width="2"/>
  <rect x="37" y="35" width="19" height="12" fill="#1f4e79"/>
  <rect x="43" y="51" width="7" height="4" fill="#94a3b8"/>
  <rect x="39" y="55" width="15" height="3" fill="#d7e3e8" stroke="#64748c"/>
  <!-- Ethernet cable and connector -->
  <path d="M25 19h8v22h7" fill="none" stroke="#d89b24" stroke-width="3"/>
  <rect x="30" y="38" width="8" height="7" fill="#d89b24"/>
  <rect x="32" y="45" width="4" height="4" fill="#64748c"/>
  <!-- blinking yellow receive signal -->
  <circle cx="49" cy="39" r="3" fill="#ffe066">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>

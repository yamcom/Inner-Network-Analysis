[project]
name = "dhcp-analyzer"
version = "0.2.0"
description = "DHCP Analyzer shared storage, writer, and worker foundation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "jinja2>=3.1.3",
  "pydantic>=2.6.0",
  "scapy>=2.5.0",
]

[dependency-groups]
dev = [
  "httpx2>=0.1.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Keep pytest temp files inside the project directory.
addopts = "--basetemp=tests/.tmp -p no:cacheprovider"
markers = [
  "slow: large-volume or long-running acceptance tests",
  "regression: spec 19.11 regression using upload/dhcp_events.old.csv",
]

